name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile/t1_ble_scanner
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/t1_ble_scanner
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile/t1_ble_scanner
        run: flutter build apk --release

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          cp mobile/t1_ble_scanner/build/app/outputs/flutter-apk/app-release.apk \
             T1_BLE_Scanner_${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "T1 BLE Scanner ${{ github.ref_name }}"
          body: |
            ## T1 BLE Control ${{ github.ref_name }}

            ### Что нового
            - **Поля NRF Connect** в карточке BLE: Scenario Type, Version, Device Type, Flags, Salt (Major hex), Device Hash (Minor hex), Raw data (полный hex пакета)
            - **Удержание карточки 2 сек → RAW в буфер**: вибрация + подсветка карточки синим (AnimatedContainer, 1 сек) — визуальное подтверждение копирования
            - **Переход Радар → Список**: тап на расшифрованную T1-метку в панели Радара переключает на вкладку Список и прокручивает к карточке этой метки
            - **Адаптивный порог «Нет сигнала»**: `max(30 сек, lastInterval × 2)` — устраняет ложный «Нет сигнала» для тегов в ночном режиме (интервал 60 сек)
            - **Исправлен краш** при обработке serviceUuids (Guid → String)

            ### Установка
            1. Разрешите установку из неизвестных источников в Android → Настройки → Безопасность
            2. Скачайте APK файл ниже и откройте его на смартфоне
            3. Запустите T1 BLE Control — сканирование стартует автоматически в режиме Production
          files: T1_BLE_Scanner_${{ github.ref_name }}.apk
          draft: false
          prerelease: false
