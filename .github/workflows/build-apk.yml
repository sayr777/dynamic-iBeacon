name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.41.8'
          channel: stable
          cache: true

      - name: Get dependencies
        working-directory: mobile/t1_ble_scanner
        run: flutter pub get

      - name: Analyze
        working-directory: mobile/t1_ble_scanner
        run: flutter analyze

      - name: Build release APK
        working-directory: mobile/t1_ble_scanner
        run: flutter build apk --release

      - name: Rename APK
        run: |
          TAG=${GITHUB_REF_NAME}
          cp mobile/t1_ble_scanner/build/app/outputs/flutter-apk/app-release.apk \
             T1_BLE_Scanner_${TAG}.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "T1 BLE Scanner ${{ github.ref_name }}"
          body: |
            ## T1 BLE Scanner ${{ github.ref_name }}

            ### Что нового
            - Режим Production включён по умолчанию (ранее открывался в режиме Prototype)
            - Прошивка метки полностью переработана: стабильная работа без SWD-отладчика
            - Таймер unix_time хранится в RAM, сбрасывается к `TAG_INITIAL_UNIX_TIME` при каждом включении

            ### Установка
            1. Разрешите установку из неизвестных источников в Android → Настройки → Безопасность
            2. Скачайте APK файл ниже и откройте его на смартфоне
            3. Запустите T1 BLE Scanner — сканирование стартует автоматически в режиме Production
          files: T1_BLE_Scanner_${{ github.ref_name }}.apk
          draft: false
          prerelease: false
